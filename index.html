<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container" class="fade-in">

        <div id="item">

            <div id="img-container">
                <img src="cat-middle-finger-pic.jpg" id="main-img">
            </div>

            <div id="btn-container">
                <button id="next-btn">Next >></button>
            </div>

        </div>

        <div id="txt-container">

            <h1 id="txt">ဟီးဟီး<br>သင်အဆဲခံလိုက်ရတဲ့အတွက်<br>အရမ်းအရမ်းကို ဝမ်းသာပီတိ<br>ဖြစ်ရပါတယ်<br>ရပြီသွားတော့။</h1>

        </div>

    </div>

    <script>

    // Next Button ကို နှိပ်လိုက်သည့်အခါ မူလ Page ကို display: none လုပ်ပြီး Simulator ကို display: block လုပ်မည်
    document.getElementById("next-btn").addEventListener("click", function() {
    document.getElementById("item").style.display = "none";
    document.getElementById("txt-container").style.display = "block";

    // Typing Effect စတင်ရန် (Function နာမည် တူအောင် စစ်ပေးထားပါသည်)
    if (typeof typeEffect === "function") {
    typeEffect();
    }
    });

    document.getElementById("next-btn").addEventListener("click", function() {
    const homePage = document.getElementById("item");
    const nextPage = document.getElementById("txt-container");

    // မူလ Page ကို ဖျောက်မည်
    homePage.style.display = "none";

    // နောက် Page ကို ဖော်ပြီး Animation Class ထည့်မည်
    nextPage.style.display = "block";
    nextPage.classList.add("fade-in");
    });

  </script>

</body>
</html>
